<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drew Szabo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #fcfcfc;
            color: #222222;
            padding: 1.5rem;
        }

        .card {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .name {
            font-family: Georgia, serif;
            font-size: 2.75rem;
            font-weight: normal;
            letter-spacing: 0.02em;
            margin-bottom: 1.25rem;
            color: #1a1a1a;
        }

        .orcid-link {
            font-family: Tahoma, sans-serif;
            font-size: 0.95rem;
            color: #555555;
            text-decoration: none;
            letter-spacing: 0.03em;
            transition: color 0.2s ease-in-out;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .orcid-link:hover {
            color: #a6ce39; /* Standard ORCID green accent on hover */
        }
    </style>
</head>
<body>

    <main class="card">
        <h1 class="name">Drew Szabo PhD MRSC</h1>
        <a 
            href="https://orcid.org/0000-0002-0089-9218" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="orcid-link"
        >
            https://orcid.org/0000-0002-0089-9218
        </a>
    </main>

</body>
</html>
